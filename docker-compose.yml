services:
  postgres:
    image: postgres:latest
    container_name: bdelearn
    environment:
      POSTGRES_USER: bdelearn
      POSTGRES_PASSWORD: bdelearn
      POSTGRES_DB: bdelearn
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
